# Static analysis configuration for Property Intel.
#
# Run with `flutter analyze`. The rules below are additive on top of
# flutter_lints and encode the conventions described in CLAUDE.md.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Import style is a project convention, so surface violations loudly.
    prefer_relative_imports: warning
    avoid_relative_lib_imports: error

linter:
  rules:
    # Imports: within lib/ always use relative paths.
    prefer_relative_imports: true
    always_use_package_imports: false
    avoid_relative_lib_imports: true
    directives_ordering: true

    # Style
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_super_parameters: true
    prefer_const_constructors: true
    prefer_const_declarations: true

    # Correctness
    avoid_print: true
    unawaited_futures: true
    always_declare_return_types: true
    cancel_subscriptions: true
    close_sinks: true
