name: propertyintelmobileapp
description: "Capstone Property Intel Mobile App"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.5.0

  # Networking
  dio: ^5.11.0

  # Value equality for entities, models and failures
  equatable: ^2.1.0

  # Date and currency formatting
  intl: ^0.20.3

  # Photo selection. Re-encodes on pick, which keeps an iPhone's native HEIC
  # from reaching an API that only accepts JPG, JPEG and PNG.
  image_picker: ^1.2.3

  # Document selection (property deeds, survey plans, certificates).
  file_picker: ^11.0.3

  # Opening case documents (survey plans, title deeds) outside the app.
  url_launcher: ^6.3.2

  # Skeleton loading for content with a known shape.
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/legal/
